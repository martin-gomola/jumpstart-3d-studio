interface:
  display_name: "Print Troubleshooter"
  short_description: "Diagnose print defects and choose one calibration test"
  default_prompt: "Use $print-troubleshooter to compare this print defect and slicer project with the filament data and propose one test."
policy:
  allow_implicit_invocation: true
dependencies:
